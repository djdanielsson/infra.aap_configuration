---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/ansible/ansible-lint.git
    rev: v26.3.0
    hooks:
      - id: ansible-lint
        pass_filenames: false
        always_run: true
        entry: ansible-lint
        args:
          - --profile=production
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
        name: black
        entry: black
        args: [--config=.black.cfg, --check, --diff]
        types: [python]
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        name: flake8
        entry: flake8
        types: [python]

  - repo: https://github.com/djdanielsson/ansible-content-prek-actions
    rev: v26.2.0
    hooks:
      - id: changelog

  - repo: local
    hooks:
      - id: galaxy-importer
        name: Ansible Galaxy Importer
        # First build the collection tarball, then pass it to the importer
        entry: bash -c "ansible-galaxy collection build --force && python -m galaxy_importer.main *.tar.gz"
        language: python
        additional_dependencies:
          ["galaxy-importer==0.4.37", "ansible-core==2.16.0"]
        pass_filenames: false
        files: ^(galaxy\.yml|docs/.*|roles/.*|plugins/.*|meta/.*|.*\.py|.*\.yml)$

...
