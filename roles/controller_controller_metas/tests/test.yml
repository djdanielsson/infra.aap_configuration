---
- name: Add controller_metas Input Sources on gateway
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aap_validate_certs: false
    aap_hostname: gateway.example.com
    aap_username: admin
    aap_password: changeme

  pre_tasks:
    - name: Include vars from gateway_configs directory
      ansible.builtin.include_vars:
        dir: ./configs
        extensions: [yml]

  roles:
    - { role: gateway_controller_metas, when: gateway_controller_metas is defined }
...
