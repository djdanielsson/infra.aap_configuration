---
argument_specs:
  main:
    short_description: An Ansible Role to create ee_registry on Ansible gateway.
    options:
      aap_ee_registry:
        description: Data structure describing your ee_registry
        type: list
        required: true
        elements: dict
        options:
          ca_cert:
            type: str
            description: ['A PEM encoded CA certificate used for authentication.', 'Mutually exclusive with O(ca_cert_path).']
          ca_cert_path:
            type: str
            description: ['Path to a PEM encoded CA certificate used for authentication.', 'Mutually exclusive with O(ca_cert).']
          client_cert:
            type: str
            description: ['A PEM encoded client certificate used for authentication.', 'Mutually exclusive with O(client_cert_path).']
          client_cert_path:
            type: str
            description: ['Path to a PEM encoded client certificate used for authentication.', 'Mutually exclusive with O(client_cert).']
          client_key:
            type: str
            description: ['A PEM encoded private key file used for authentication.', 'Mutually exclusive with O(client_key_path).']
          client_key_path:
            type: str
            description: ['Path to a PEM encoded private key file used for authentication.', 'Mutually exclusive with O(client_key).']
          download_concurrency:
            type: str
            description: ['Number of concurrent collections to download.']
          name:
            required: True
            type: str
            description: ['Name of the registry to remove or modify.']
          password:
            type: str
            description: ['The password to authenticate to the registry with.']
          proxy_password:
            type: str
            description: ['Password for the username to use for the proxy connection.']
          proxy_url:
            type: str
            description: ['Proxy URL to use for the connection.']
          proxy_username:
            type: str
            description: ['Username to use for the proxy connection.']
          rate_limit:
            type: str
            description: ['Limits total download rate in requests per second.']
          state:
            default: present
            type: str
            description: ['If V(absent), then the module deletes the registry.', 'The module does not fail if the registry does not exist because the state is already as expected.', 'If V(present), then the module updates the description and README file for the registry.']
          tls_validation:
            default: True
            type: bool
            description: ['Whether to validate TLS when connecting to the remote registry.']
          url:
            type: str
            description: ['The URL of the remote registry.', 'Required if O(state=present).']
          username:
            type: str
            description: ['The username to authenticate to the registry with.']

      # Async variables
      ee_registry_async_retries:
        default: "{{ aap_configuration_async_retries | default(30) }}"
        required: false
        description: This variable sets the number of retries to attempt for the role.
      aap_configuration_async_retries:
        default: 30
        required: false
        description: This variable sets number of retries across all roles as a default.
      ee_registry_async_delay:
        default: "{{ aap_configuration_async_delay | default(1) }}"
        required: false
        description: This variable sets delay between retries for the role.
      aap_configuration_async_delay:
        default: 1
        required: false
        description: This variable sets delay between retries across all roles as a default.
      aap_configuration_async_dir:
        default:
        required: false
        description: Sets the directory to write the results file for async tasks. The default value is set to `null` which uses the Ansible Default of `/root/.ansible_async/`.

      # No_log variables
      gateway_ee_registry_secure_logging:
        default: "{{ aap_configuration_secure_logging | default(false) }}"
        required: false
        type: bool
        description: Whether or not to include the sensitive tasks from this role in the log. Set this value to `true` if you will be providing your sensitive values from elsewhere.
      aap_configuration_secure_logging:
        default: false
        required: false
        type: bool
        description: This variable enables secure logging across all roles as a default.

      # Generic across all roles
      platform_state:
        default: present
        required: false
        description: The state all objects will take unless overridden by object default
        type: str
      aap_hostname:
        default: None
        required: false
        description: URL to the Ansible gateway Server.
        type: str
      aap_validate_certs:
        default: true
        required: false
        description: Whether or not to validate the Ansible gateway Server's SSL certificate.
        type: str
      aap_username:
        default: None
        required: false
        description: Admin User on the Ansible gateway Server. Either username / password or oauthtoken need to be specified.
        type: str
      aap_password:
        default: None
        required: false
        description: Gateway Admin User's password on the Ansible gateway Server. This should be stored in an Ansible Vault at vars/gateway-secrets.yml or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
      aap_token:
        default: None
        required: false
        description: Gateway Admin User's token on the Ansible gateway Server. This should be stored in an Ansible Vault at or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
...
