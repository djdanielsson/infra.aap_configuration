---
argument_specs:
  main:
    short_description: An Ansible Role to create collection_repositories on Ansible gateway.
    options:
      aap_collection_repositories:
        description: Data structure describing your collection_repositories
        type: list
        required: true
        elements: dict
        options:
          description:
            type: str
            description: ['Description for the Collection repository.']
          distribution:
            type: dict
            description: ['Content in repositories without a distribution will not be visible to clients for sync, download or search.']
          interval:
            default: 1
            required: False
            type: float
            description: ['The interval to request an update from Automation Hub.']
          name:
            required: True
            type: str
            description: ['Collection repository name.']
          private:
            default: False
            type: bool
            description: ['Make the repository private.']
          pulp_labels:
            type: dict
            description: Pipeline and search options for the collection repository.
          remote:
            type: str
            description: ['Existing remote name.']
          retain_repo_versions:
            default: 0
            type: int
            description: ['Retain X versions of the repository.', 'Default is V(0) which retains all versions.']
          state:
            default: present
            type: str
            description: ['If V(absent), then the module deletes the repository and its distribution.', 'If V(present), then the module updates the repository.']
          timeout:
            type: int
            description: ['If waiting for the repository to update this will abort after this amount of seconds']
          update_repo:
            default: False
            required: False
            type: bool
            description: ['Whether to update the collection repository before exiting the module.']
          wait:
            default: True
            required: False
            type: bool
            description: ['Wait for the collection repository to finish syncing before returning.']

      # Async variables
      collection_repositories_async_retries:
        default: "{{ aap_configuration_async_retries | default(30) }}"
        required: false
        description: This variable sets the number of retries to attempt for the role.
      aap_configuration_async_retries:
        default: 30
        required: false
        description: This variable sets number of retries across all roles as a default.
      collection_repositories_async_delay:
        default: "{{ aap_configuration_async_delay | default(1) }}"
        required: false
        description: This variable sets delay between retries for the role.
      aap_configuration_async_delay:
        default: 1
        required: false
        description: This variable sets delay between retries across all roles as a default.
      aap_configuration_async_dir:
        default:
        required: false
        description: Sets the directory to write the results file for async tasks. The default value is set to `null` which uses the Ansible Default of `/root/.ansible_async/`.

      # No_log variables
      gateway_collection_repositories_secure_logging:
        default: "{{ aap_configuration_secure_logging | default(false) }}"
        required: false
        type: bool
        description: Whether or not to include the sensitive tasks from this role in the log. Set this value to `true` if you will be providing your sensitive values from elsewhere.
      aap_configuration_secure_logging:
        default: false
        required: false
        type: bool
        description: This variable enables secure logging across all roles as a default.

      # Generic across all roles
      platform_state:
        default: present
        required: false
        description: The state all objects will take unless overridden by object default
        type: str
      aap_hostname:
        default: None
        required: false
        description: URL to the Ansible gateway Server.
        type: str
      aap_validate_certs:
        default: true
        required: false
        description: Whether or not to validate the Ansible gateway Server's SSL certificate.
        type: str
      aap_username:
        default: None
        required: false
        description: Admin User on the Ansible gateway Server. Either username / password or oauthtoken need to be specified.
        type: str
      aap_password:
        default: None
        required: false
        description: Gateway Admin User's password on the Ansible gateway Server. This should be stored in an Ansible Vault at vars/gateway-secrets.yml or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
      aap_token:
        default: None
        required: false
        description: Gateway Admin User's token on the Ansible gateway Server. This should be stored in an Ansible Vault at or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
...
