---
argument_specs:
  main:
    short_description: An Ansible Role to create user on Ansible gateway.
    options:
      aap_user:
        description: Data structure describing your user
        type: list
        required: true
        elements: dict
        options:
          append:
            default: True
            type: bool
            description: ['If V(yes), then add the user to the groups specified in O(groups).', 'If V(no), then the module only adds the user to the groups specified in O(groups), removing them from all other groups.']
          email:
            type: str
            description: ["User's email address. That address must be correctly formed."]
          first_name:
            type: str
            description: ["User's first name."]
          groups:
            type: list
            description: ['List of the groups the user is added to. When not set or set to an empty list (V([])), the module removes the user from all groups.']
          is_superuser:
            default: False
            type: bool
            description: ['Gives the super user permissions to the user.']
          last_name:
            type: str
            description: ["User's last name."]
          password:
            type: str
            description: ["User's password as a clear string. The password must contain at least 9 characters with numbers or special characters."]
          state:
            default: present
            type: str
            description: ['If V(absent), then the module deletes the user.', 'The module does not fail if the user does not exist because the state is already as expected.', 'If V(present), then the module creates the user if it does not already exist. If the user account already exists, then the module updates its state.']
          username:
            required: True
            type: str
            description: ['Name of the user to create, remove, or modify.']

      # Async variables
      user_async_retries:
        default: "{{ aap_configuration_async_retries | default(30) }}"
        required: false
        description: This variable sets the number of retries to attempt for the role.
      aap_configuration_async_retries:
        default: 30
        required: false
        description: This variable sets number of retries across all roles as a default.
      user_async_delay:
        default: "{{ aap_configuration_async_delay | default(1) }}"
        required: false
        description: This variable sets delay between retries for the role.
      aap_configuration_async_delay:
        default: 1
        required: false
        description: This variable sets delay between retries across all roles as a default.
      aap_configuration_async_dir:
        default:
        required: false
        description: Sets the directory to write the results file for async tasks. The default value is set to `null` which uses the Ansible Default of `/root/.ansible_async/`.

      # No_log variables
      gateway_user_secure_logging:
        default: "{{ aap_configuration_secure_logging | default(false) }}"
        required: false
        type: bool
        description: Whether or not to include the sensitive tasks from this role in the log. Set this value to `true` if you will be providing your sensitive values from elsewhere.
      aap_configuration_secure_logging:
        default: false
        required: false
        type: bool
        description: This variable enables secure logging across all roles as a default.

      # Generic across all roles
      platform_state:
        default: present
        required: false
        description: The state all objects will take unless overridden by object default
        type: str
      aap_hostname:
        default: None
        required: false
        description: URL to the Ansible gateway Server.
        type: str
      aap_validate_certs:
        default: true
        required: false
        description: Whether or not to validate the Ansible gateway Server's SSL certificate.
        type: str
      aap_username:
        default: None
        required: false
        description: Admin User on the Ansible gateway Server. Either username / password or oauthtoken need to be specified.
        type: str
      aap_password:
        default: None
        required: false
        description: Gateway Admin User's password on the Ansible gateway Server. This should be stored in an Ansible Vault at vars/gateway-secrets.yml or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
      aap_token:
        default: None
        required: false
        description: Gateway Admin User's token on the Ansible gateway Server. This should be stored in an Ansible Vault at or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
...
