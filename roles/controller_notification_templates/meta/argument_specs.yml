---
argument_specs:
  main:
    short_description: An Ansible Role to create notification_templates on Ansible gateway.
    options:
      aap_notification_templates:
        description: Data structure describing your notification_templates
        type: list
        required: true
        elements: dict
        options:
          copy_from:
            type: str
            description: ['Name or id to copy the notification from.', 'This will copy an existing notification and change any parameters supplied.', 'The new notification name will be the one provided in the name parameter.', 'The organization parameter is not used in this, to facilitate copy from one organization to another.', 'Provide the id or use the lookup plugin to provide the id if multiple notifications share the same name.']
          description:
            type: str
            description: ['The description of the notification.']
          messages:
            type: dict
            description: ['Optional custom messages for notification template.']
          name:
            required: True
            type: str
            description: ['The name of the notification.']
          new_name:
            type: str
            description: ['Setting this option will change the existing name (looked up via the name field.']
          notification_configuration:
            type: dict
            description: ['The notification configuration file. Note providing this field would disable all notification-configuration-related fields.', 'username (the mail server username)', 'sender (the sender email address)', 'recipients (the recipients email addresses)', 'use_tls (the TLS trigger)', 'host (the mail server host)', 'use_ssl (the SSL trigger)', 'password (the mail server password)', 'port (the mail server port)', 'channels (the destination Slack channels)', 'token (the access token)', 'account_token (the Twillio account token)', 'from_number (the source phone number)', 'to_numbers (the destination phone numbers)', 'account_sid (the Twillio account SID)', 'subdomain (the PagerDuty subdomain)', 'service_key (the PagerDuty service/integration API key)', 'client_name (the PagerDuty client identifier)', 'message_from (the label to be shown with the notification)', 'color (the notification color)', 'notify (the notify channel trigger)', 'url (the target URL)', 'headers (the HTTP headers as JSON string)', 'server (the IRC server address)', 'nickname (the IRC nickname)', 'targets (the destination channels or users)']
          notification_type:
            type: str
            description: ['The type of notification to be sent.']
          organization:
            type: str
            description: ['The organization name, ID, or named URL the notification belongs to.']
          state:
            default: present
            type: str
            description: ['Desired state of the resource.']

      # Async variables
      notification_templates_async_retries:
        default: "{{ aap_configuration_async_retries | default(30) }}"
        required: false
        description: This variable sets the number of retries to attempt for the role.
      aap_configuration_async_retries:
        default: 30
        required: false
        description: This variable sets number of retries across all roles as a default.
      notification_templates_async_delay:
        default: "{{ aap_configuration_async_delay | default(1) }}"
        required: false
        description: This variable sets delay between retries for the role.
      aap_configuration_async_delay:
        default: 1
        required: false
        description: This variable sets delay between retries across all roles as a default.
      aap_configuration_async_dir:
        default:
        required: false
        description: Sets the directory to write the results file for async tasks. The default value is set to `null` which uses the Ansible Default of `/root/.ansible_async/`.

      # No_log variables
      gateway_notification_templates_secure_logging:
        default: "{{ aap_configuration_secure_logging | default(false) }}"
        required: false
        type: bool
        description: Whether or not to include the sensitive tasks from this role in the log. Set this value to `true` if you will be providing your sensitive values from elsewhere.
      aap_configuration_secure_logging:
        default: false
        required: false
        type: bool
        description: This variable enables secure logging across all roles as a default.

      # Generic across all roles
      platform_state:
        default: present
        required: false
        description: The state all objects will take unless overridden by object default
        type: str
      aap_hostname:
        default: None
        required: false
        description: URL to the Ansible gateway Server.
        type: str
      aap_validate_certs:
        default: true
        required: false
        description: Whether or not to validate the Ansible gateway Server's SSL certificate.
        type: str
      aap_username:
        default: None
        required: false
        description: Admin User on the Ansible gateway Server. Either username / password or oauthtoken need to be specified.
        type: str
      aap_password:
        default: None
        required: false
        description: Gateway Admin User's password on the Ansible gateway Server. This should be stored in an Ansible Vault at vars/gateway-secrets.yml or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
      aap_token:
        default: None
        required: false
        description: Gateway Admin User's token on the Ansible gateway Server. This should be stored in an Ansible Vault at or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
...
