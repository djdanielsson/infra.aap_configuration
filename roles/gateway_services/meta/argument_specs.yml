---
argument_specs:
  main:
    short_description: An Ansible Role to create services on Ansible gateway.
    options:
      aap_services:
        description: Data structure describing your services
        type: list
        required: true
        elements: dict
        options:
          api_slug:
            type: str
            description: ['URL slug for the gateway API path for the Controller, Hub and EDA services', 'Gateway API route requires value "gateway", but the slug is not used']
          description:
            type: str
            description: The description of the Service
          enable_gateway_auth:
            type: bool
            description: If false, the AAP gateway will not insert a gateway token into the proxied request
          http_port:
            type: str
            description: ['Name or ID referencing the Http Port', 'Required when creating a new route']
          is_internal_route:
            type: bool
            description: ['Flag whether or not the service is an internal route.', 'Internal routes are only accessible to other services.']
          is_service_https:
            default: False
            type: bool
            description: Flag whether or not the service cluster uses https
          name:
            required: True
            type: str
            description: The name of the Service, must be unique
          new_name:
            type: str
            description: Setting this option will change the existing name (looked up via the name field)
          node_tags:
            type: str
            description: ['Comma separated string', 'Selects which (tagged) nodes receive traffic from this route']
          order:
            type: int
            description: ['The order to apply the routes in lower numbers are first. Items with the same value have no guaranteed order', 'Defaults to 50 when created']
          service_cluster:
            type: str
            description: ['Name or ID referencing the Service Cluster', 'Required when creating a new Service']
          service_path:
            type: str
            description: ['URL path on the AAP Service cluster to route traffic to', 'Required when creating a new Service']
          service_port:
            type: int
            description: ['Port on the service cluster to route traffic to', 'Required when creating a new Service']

      # Async variables
      services_async_retries:
        default: "{{ aap_configuration_async_retries | default(30) }}"
        required: false
        description: This variable sets the number of retries to attempt for the role.
      aap_configuration_async_retries:
        default: 30
        required: false
        description: This variable sets number of retries across all roles as a default.
      services_async_delay:
        default: "{{ aap_configuration_async_delay | default(1) }}"
        required: false
        description: This variable sets delay between retries for the role.
      aap_configuration_async_delay:
        default: 1
        required: false
        description: This variable sets delay between retries across all roles as a default.
      aap_configuration_async_dir:
        default:
        required: false
        description: Sets the directory to write the results file for async tasks. The default value is set to `null` which uses the Ansible Default of `/root/.ansible_async/`.

      # No_log variables
      gateway_services_secure_logging:
        default: "{{ aap_configuration_secure_logging | default(false) }}"
        required: false
        type: bool
        description: Whether or not to include the sensitive tasks from this role in the log. Set this value to `true` if you will be providing your sensitive values from elsewhere.
      aap_configuration_secure_logging:
        default: false
        required: false
        type: bool
        description: This variable enables secure logging across all roles as a default.

      # Generic across all roles
      platform_state:
        default: present
        required: false
        description: The state all objects will take unless overridden by object default
        type: str
      aap_hostname:
        default: None
        required: false
        description: URL to the Ansible gateway Server.
        type: str
      aap_validate_certs:
        default: true
        required: false
        description: Whether or not to validate the Ansible gateway Server's SSL certificate.
        type: str
      aap_username:
        default: None
        required: false
        description: Admin User on the Ansible gateway Server. Either username / password or oauthtoken need to be specified.
        type: str
      aap_password:
        default: None
        required: false
        description: Gateway Admin User's password on the Ansible gateway Server. This should be stored in an Ansible Vault at vars/gateway-secrets.yml or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
      aap_token:
        default: None
        required: false
        description: Gateway Admin User's token on the Ansible gateway Server. This should be stored in an Ansible Vault at or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
...
