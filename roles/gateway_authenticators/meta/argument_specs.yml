---
argument_specs:
  main:
    short_description: An Ansible Role to create authenticators on Ansible gateway.
    options:
      aap_authenticators:
        description: Data structure describing your authenticators
        type: list
        required: true
        elements: dict
        options:
          auto_migrate_users_to:
            type: str
            description: ['Automatically move users from this authenticator to the target authenticator when a matching user logs in via the target authenticator.', 'For this to work, the field used for the user ID on both authenticators needs to have the same value.', 'This should only be used when migrating users between two authentication mechanisms that share the same user database.']
          configuration:
            default: {}
            type: dict
            description: ['The required configuration for this source', "dict keys specified by the module in option 'type'"]
          create_objects:
            type: bool
            description: ['Allow authenticator to create objects (users, teams, organizations)', 'Defaults to true (by API)']
          enabled:
            type: bool
            description: ['Enable/Disable the authenticator', 'Defaults to false (by API)']
          name:
            required: True
            type: str
            description: The name of the authenticator, must be unique
          new_name:
            type: str
            description: Setting this option will change the existing name (looked up via the name field)
          order:
            type: int
            description: ['The order in which an authenticator will be tried. This only pertains to username/password authenticators', 'defaults to 1 (by API)']
          remove_users:
            default: True
            type: bool
            description: When a user authenticates from this source should they be removed from any other groups they were previously added to
          slug:
            type: str
            description: ['An immutable identifier for the authenticator', 'Must be unique', "If not provided, it's auto-generated"]
          type:
            type: str
            description: ['The type of authentication service this is', "Can be one of the modules - 'ansible_base.authentication.authenticator_plugins.*'", 'https://github.com/ansible/django-ansible-base/tree/devel/ansible_base/authentication/authenticator_plugins']

      # Async variables
      authenticators_async_retries:
        default: "{{ aap_configuration_async_retries | default(30) }}"
        required: false
        description: This variable sets the number of retries to attempt for the role.
      aap_configuration_async_retries:
        default: 30
        required: false
        description: This variable sets number of retries across all roles as a default.
      authenticators_async_delay:
        default: "{{ aap_configuration_async_delay | default(1) }}"
        required: false
        description: This variable sets delay between retries for the role.
      aap_configuration_async_delay:
        default: 1
        required: false
        description: This variable sets delay between retries across all roles as a default.
      aap_configuration_async_dir:
        default:
        required: false
        description: Sets the directory to write the results file for async tasks. The default value is set to `null` which uses the Ansible Default of `/root/.ansible_async/`.

      # No_log variables
      gateway_authenticators_secure_logging:
        default: "{{ aap_configuration_secure_logging | default(false) }}"
        required: false
        type: bool
        description: Whether or not to include the sensitive tasks from this role in the log. Set this value to `true` if you will be providing your sensitive values from elsewhere.
      aap_configuration_secure_logging:
        default: false
        required: false
        type: bool
        description: This variable enables secure logging across all roles as a default.

      # Generic across all roles
      platform_state:
        default: present
        required: false
        description: The state all objects will take unless overridden by object default
        type: str
      aap_hostname:
        default: None
        required: false
        description: URL to the Ansible gateway Server.
        type: str
      aap_validate_certs:
        default: true
        required: false
        description: Whether or not to validate the Ansible gateway Server's SSL certificate.
        type: str
      aap_username:
        default: None
        required: false
        description: Admin User on the Ansible gateway Server. Either username / password or oauthtoken need to be specified.
        type: str
      aap_password:
        default: None
        required: false
        description: Gateway Admin User's password on the Ansible gateway Server. This should be stored in an Ansible Vault at vars/gateway-secrets.yml or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
      aap_token:
        default: None
        required: false
        description: Gateway Admin User's token on the Ansible gateway Server. This should be stored in an Ansible Vault at or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
...
