---
argument_specs:
  main:
    short_description: An Ansible Role to create workflow_job_templates on Ansible gateway.
    options:
      aap_workflow_job_templates:
        description: Data structure describing your workflow_job_templates
        type: list
        required: true
        elements: dict
        options:
          allow_simultaneous:
            type: bool
            description: ['Allow simultaneous runs of the workflow job template.']
          ask_inventory_on_launch:
            type: bool
            description: ['Prompt user for inventory on launch of this workflow job template']
          ask_labels_on_launch:
            type: bool
            description: ['Prompt user for labels on launch.']
          ask_limit_on_launch:
            type: bool
            description: ['Prompt user for limit on launch of this workflow job template']
          ask_scm_branch_on_launch:
            type: bool
            description: ['Prompt user for SCM branch on launch of this workflow job template']
          ask_skip_tags_on_launch:
            type: bool
            description: ['Prompt user for job tags to skip on launch.']
          ask_tags_on_launch:
            type: bool
            description: ['Prompt user for job tags on launch.']
          ask_variables_on_launch:
            type: bool
            description: ['Prompt user for C(extra_vars) on launch.']
          copy_from:
            type: str
            description: ['Name or id to copy the workflow job template from.', 'This will copy an existing workflow job template and change any parameters supplied.', 'The new workflow job template name will be the one provided in the name parameter.', 'The organization parameter is not used in this, to facilitate copy from one organization to another.', 'Provide the id or use the lookup plugin to provide the id if multiple workflow job templates share the same name.']
          description:
            type: str
            description: ['Optional description of this workflow job template.']
          destroy_current_nodes:
            default: False
            type: bool
            description: ['Set in order to destroy current workflow_nodes on the workflow.', 'This option is used for full workflow update, if not used, nodes not described in workflow will persist and keep current associations and links.']
          extra_vars:
            type: dict
            description: ['Variables which will be made available to jobs ran inside the workflow.']
          inventory:
            type: str
            description: ['Name, ID, or named URL of inventory applied as a prompt, assuming job template prompts for inventory']
          job_tags:
            type: str
            description: ['Comma separated list of the tags to use for the job template.']
          labels:
            type: list
            description: ['The labels applied to this job template', 'Must be created with the labels module first. This will error if the label has not been created.']
          limit:
            type: str
            description: ['Limit applied as a prompt, assuming job template prompts for limit']
          name:
            required: True
            type: str
            description: ['Name of this workflow job template.']
          new_name:
            type: str
            description: ['Setting this option will change the existing name.']
          notification_templates_approvals:
            type: list
            description: ['list of notifications to send on approval']
          notification_templates_error:
            type: list
            description: ['list of notifications to send on error']
          notification_templates_started:
            type: list
            description: ['list of notifications to send on start']
          notification_templates_success:
            type: list
            description: ['list of notifications to send on success']
          organization:
            type: str
            description: ['Organization name, ID, or named URL the workflow job template exists in.', 'Used to help lookup the object, cannot be modified using this module.', 'If not provided, will lookup by name only, which does not work with duplicates.']
          scm_branch:
            type: str
            description: ['SCM branch applied as a prompt, assuming job template prompts for SCM branch']
          skip_tags:
            type: str
            description: ['Comma separated list of the tags to skip for the job template.']
          state:
            default: present
            type: str
            description: ['Desired state of the resource.']
          survey_enabled:
            type: bool
            description: ['Setting that variable will prompt the user for job type on the workflow launch.']
          survey_spec:
            type: dict
            description: ['The definition of the survey associated to the workflow.']
          webhook_credential:
            type: str
            description: ['Personal Access Token for posting back the status to the service API']
          webhook_service:
            type: str
            description: ['Service that webhook requests will be accepted from']
          workflow_nodes:
            type: list
            description: ['A json list of nodes and their coresponding options. The following suboptions describe a single node.']

      # Async variables
      workflow_job_templates_async_retries:
        default: "{{ aap_configuration_async_retries | default(30) }}"
        required: false
        description: This variable sets the number of retries to attempt for the role.
      aap_configuration_async_retries:
        default: 30
        required: false
        description: This variable sets number of retries across all roles as a default.
      workflow_job_templates_async_delay:
        default: "{{ aap_configuration_async_delay | default(1) }}"
        required: false
        description: This variable sets delay between retries for the role.
      aap_configuration_async_delay:
        default: 1
        required: false
        description: This variable sets delay between retries across all roles as a default.
      aap_configuration_async_dir:
        default:
        required: false
        description: Sets the directory to write the results file for async tasks. The default value is set to `null` which uses the Ansible Default of `/root/.ansible_async/`.

      # No_log variables
      gateway_workflow_job_templates_secure_logging:
        default: "{{ aap_configuration_secure_logging | default(false) }}"
        required: false
        type: bool
        description: Whether or not to include the sensitive tasks from this role in the log. Set this value to `true` if you will be providing your sensitive values from elsewhere.
      aap_configuration_secure_logging:
        default: false
        required: false
        type: bool
        description: This variable enables secure logging across all roles as a default.

      # Generic across all roles
      platform_state:
        default: present
        required: false
        description: The state all objects will take unless overridden by object default
        type: str
      aap_hostname:
        default: None
        required: false
        description: URL to the Ansible gateway Server.
        type: str
      aap_validate_certs:
        default: true
        required: false
        description: Whether or not to validate the Ansible gateway Server's SSL certificate.
        type: str
      aap_username:
        default: None
        required: false
        description: Admin User on the Ansible gateway Server. Either username / password or oauthtoken need to be specified.
        type: str
      aap_password:
        default: None
        required: false
        description: Gateway Admin User's password on the Ansible gateway Server. This should be stored in an Ansible Vault at vars/gateway-secrets.yml or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
      aap_token:
        default: None
        required: false
        description: Gateway Admin User's token on the Ansible gateway Server. This should be stored in an Ansible Vault at or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
...
