---
argument_specs:
  main:
    short_description: An Ansible Role to create job_templates on Ansible gateway.
    options:
      aap_job_templates:
        description: Data structure describing your job_templates
        type: list
        required: true
        elements: dict
        options:
          allow_simultaneous:
            type: bool
            description: ['Allow simultaneous runs of the job template.']
          ask_credential_on_launch:
            type: bool
            description: ['Prompt user for credential on launch.']
          ask_diff_mode_on_launch:
            type: bool
            description: ['Prompt user to enable diff mode (show changes) to files when supported by modules.']
          ask_execution_environment_on_launch:
            type: bool
            description: ['Prompt user for execution environment on launch.']
          ask_forks_on_launch:
            type: bool
            description: ['Prompt user for forks on launch.']
          ask_instance_groups_on_launch:
            type: bool
            description: ['Prompt user for instance groups on launch.']
          ask_inventory_on_launch:
            type: bool
            description: ['Prompt user for inventory on launch.']
          ask_job_slice_count_on_launch:
            type: bool
            description: ['Prompt user for job slice count on launch.']
          ask_job_type_on_launch:
            type: bool
            description: ['Prompt user for job type on launch.']
          ask_labels_on_launch:
            type: bool
            description: ['Prompt user for labels on launch.']
          ask_limit_on_launch:
            type: bool
            description: ['Prompt user for a limit on launch.']
          ask_scm_branch_on_launch:
            type: bool
            description: ['Prompt user for (scm branch) on launch.']
          ask_skip_tags_on_launch:
            type: bool
            description: ['Prompt user for job tags to skip on launch.']
          ask_tags_on_launch:
            type: bool
            description: ['Prompt user for job tags on launch.']
          ask_timeout_on_launch:
            type: bool
            description: ['Prompt user for timeout on launch.']
          ask_variables_on_launch:
            type: bool
            description: ['Prompt user for (extra_vars) on launch.']
          ask_verbosity_on_launch:
            type: bool
            description: ['Prompt user to choose a verbosity level on launch.']
          become_enabled:
            type: bool
            description: ['Activate privilege escalation.']
          copy_from:
            type: str
            description: ['Name or id to copy the job template from.', 'This will copy an existing job template and change any parameters supplied.', 'The new job template name will be the one provided in the name parameter.', 'The organization parameter is not used in this, to facilitate copy from one organization to another.', 'Provide the id or use the lookup plugin to provide the id if multiple job templates share the same name.']
          credential:
            type: str
            description: ['Name, ID, or named URL of the credential to use for the job template.', "Deprecated, use 'credentials'."]
          credentials:
            type: list
            description: ['List of credential names, IDs, or named URLs to use for the job template.']
          custom_virtualenv:
            type: str
            description: ['Local absolute file path containing a custom Python virtualenv to use.', 'Only compatible with older versions of AWX/Tower', 'Deprecated, will be removed in the future']
          description:
            type: str
            description: ['Description to use for the job template.']
          diff_mode:
            type: bool
            description: ['Enable diff mode for the job template.']
          execution_environment:
            type: str
            description: ['Execution Environment name, ID, or named URL to use for the job template.']
          extra_vars:
            type: dict
            description: ['Specify C(extra_vars) for the template.']
          force_handlers:
            type: bool
            description: ['Enable forcing playbook handlers to run even if a task fails.']
          forks:
            type: int
            description: ['The number of parallel or simultaneous processes to use while executing the playbook.']
          host_config_key:
            type: str
            description: ['Allow provisioning callbacks using this host config key.']
          instance_groups:
            type: list
            description: ['list of Instance Group names, IDs, or named URLs for this Organization to run on.']
          inventory:
            type: str
            description: ['Name, ID, or named URL of the inventory to use for the job template.']
          job_slice_count:
            type: int
            description: ['The number of jobs to slice into at runtime. Will cause the Job Template to launch a workflow if value is greater than 1.']
          job_tags:
            type: str
            description: ['Comma separated list of the tags to use for the job template.']
          job_type:
            type: str
            description: ['The job type to use for the job template.']
          labels:
            type: list
            description: ['The labels applied to this job template', 'Must be created with the labels module first. This will error if the label has not been created.']
          limit:
            type: str
            description: ['A host pattern to further constrain the list of hosts managed or affected by the playbook']
          name:
            required: True
            type: str
            description: ['Name to use for the job template.']
          new_name:
            type: str
            description: ['Setting this option will change the existing name (looked up via the name field.']
          notification_templates_error:
            type: list
            description: ['list of notifications to send on error']
          notification_templates_started:
            type: list
            description: ['list of notifications to send on start']
          notification_templates_success:
            type: list
            description: ['list of notifications to send on success']
          organization:
            type: str
            description: ['Organization name, ID, or named URL the job template exists in.', 'Used to help lookup the object, cannot be modified using this module.', 'The Organization is inferred from the associated project', 'If not provided, will lookup by name only, which does not work with duplicates.', 'Requires Automation Platform Version 3.7.0 or AWX 10.0.0 IS NOT backwards compatible with earlier versions.']
          playbook:
            type: str
            description: ['Path to the playbook to use for the job template within the project provided.']
          prevent_instance_group_fallback:
            type: bool
            description: ['Prevent falling back to instance groups set on the associated inventory or organization']
          project:
            type: str
            description: ['Name, ID, or named URL of the project to use for the job template.']
          scm_branch:
            type: str
            description: ['Branch to use in job run. Project default used if blank. Only allowed if project allow_override field is set to true.']
          skip_tags:
            type: str
            description: ['Comma separated list of the tags to skip for the job template.']
          start_at_task:
            type: str
            description: ['Start the playbook at the task matching this name.']
          state:
            default: present
            type: str
            description: ['Desired state of the resource.']
          survey_enabled:
            type: bool
            description: ['Enable a survey on the job template.']
          survey_spec:
            type: dict
            description: ['JSON/YAML dict formatted survey definition.']
          timeout:
            type: int
            description: ['Maximum time in seconds to wait for a job to finish (server-side).']
          use_fact_cache:
            type: bool
            description: ['Enable use of fact caching for the job template.']
          vault_credential:
            type: str
            description: ['Name, ID, or named URL of the vault credential to use for the job template.', "Deprecated, use 'credentials'."]
          verbosity:
            type: int
            description: ['Control the output level Ansible produces as the playbook runs. 0 - Normal, 1 - Verbose, 2 - More Verbose, 3 - Debug, 4 - Connection Debug.']
          webhook_credential:
            type: str
            description: ['Personal Access Token for posting back the status to the service API']
          webhook_service:
            type: str
            description: ['Service that webhook requests will be accepted from']

      # Async variables
      job_templates_async_retries:
        default: "{{ aap_configuration_async_retries | default(30) }}"
        required: false
        description: This variable sets the number of retries to attempt for the role.
      aap_configuration_async_retries:
        default: 30
        required: false
        description: This variable sets number of retries across all roles as a default.
      job_templates_async_delay:
        default: "{{ aap_configuration_async_delay | default(1) }}"
        required: false
        description: This variable sets delay between retries for the role.
      aap_configuration_async_delay:
        default: 1
        required: false
        description: This variable sets delay between retries across all roles as a default.
      aap_configuration_async_dir:
        default:
        required: false
        description: Sets the directory to write the results file for async tasks. The default value is set to `null` which uses the Ansible Default of `/root/.ansible_async/`.

      # No_log variables
      gateway_job_templates_secure_logging:
        default: "{{ aap_configuration_secure_logging | default(false) }}"
        required: false
        type: bool
        description: Whether or not to include the sensitive tasks from this role in the log. Set this value to `true` if you will be providing your sensitive values from elsewhere.
      aap_configuration_secure_logging:
        default: false
        required: false
        type: bool
        description: This variable enables secure logging across all roles as a default.

      # Generic across all roles
      platform_state:
        default: present
        required: false
        description: The state all objects will take unless overridden by object default
        type: str
      aap_hostname:
        default: None
        required: false
        description: URL to the Ansible gateway Server.
        type: str
      aap_validate_certs:
        default: true
        required: false
        description: Whether or not to validate the Ansible gateway Server's SSL certificate.
        type: str
      aap_username:
        default: None
        required: false
        description: Admin User on the Ansible gateway Server. Either username / password or oauthtoken need to be specified.
        type: str
      aap_password:
        default: None
        required: false
        description: Gateway Admin User's password on the Ansible gateway Server. This should be stored in an Ansible Vault at vars/gateway-secrets.yml or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
      aap_token:
        default: None
        required: false
        description: Gateway Admin User's token on the Ansible gateway Server. This should be stored in an Ansible Vault at or elsewhere and called from a parent playbook. Either username / password or oauthtoken need to be specified.
        type: str
...
